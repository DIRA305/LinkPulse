<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkPearl</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>LinkPearl</h1>
        <p>Enter a URL to analyze its security risk score.</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="e.g., http://login-bank-secure.free.site/login">
            <button onclick="checkURL()">Analyze Link</button>
        </div>

        <div id="resultCard" class="result-card hidden">
            <h2>Analysis Result</h2>
            
            <div class="score-container">
                <span>Risk Score:</span>
                <span id="riskScore" class="score">0/100</span>
            </div>

            <div class="status-badge" id="statusBadge">SAFE</div>

            <div class="details">
                <h3>Detected Risk Indicators:</h3>
                <ul id="reasonsList"></ul>
            </div>

            <div class="action-box" id="actionBox"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
